[project]
name = "knowledge-base"
version = "0.1.0"
description = "企业技术资料知识库问答系统：文档导入工作流与检索增强问答工作流（LangGraph + BGE-M3 + Milvus + FastAPI + Vue 3）"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    # 系统设置的敏感值使用 Fernet 加密落库，必须由本项目直接声明而不是依赖 minio 的传递依赖。
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "pymilvus[model]>=3.0.1",
    "modelscope>=1.39.1",
    "openai-agents>=0.20.0",
    "mcp<2.0.0",
    "dashscope>=1.26.7",
    "uvicorn[standard]>=0.52.3",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "asyncmy>=0.2.14",
    "pypdf>=6.16.2",
    "redis>=8.1.0",
]

[dependency-groups]
# 仅本地开发与回归使用，不进入运行时依赖，避免镜像体积和 torch 依赖树被污染。
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    # TODO(S1): 补 httpx>=0.27 供 fastapi TestClient 使用；当前 httpx 仅作为 openai 的传递依赖存在，
    # 显式声明需要一次能访问 pytorch 索引的 `uv lock`，否则 uv.lock 会与 pyproject 不一致。
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# 默认只跑不依赖外部服务的用例；联调用例显式加 integration 标记，需要时 `-m integration` 单跑。
addopts = "-q -m 'not integration'"
markers = [
    "unit: 纯逻辑用例，不连接 MySQL / Milvus / Redis / MongoDB / LLM",
    "integration: 需要外部服务或真实模型的联调用例",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["test", "frontend", ".venv"]

[tool.ruff.lint]
# S0 已先把零风险机械项修掉（未用导入 / 无占位符 f-string / 行尾换行），
# 下面被忽略的规则仍属于存量债务，每条都有不改的理由，阶段推进时逐条从这里删掉：
#   I001  导入排序：多个模块 import 时就有副作用（连 Mongo / Milvus），不做批量重排
#   E402  顶部导入：config/ 与入口文件用 sys.path / os.environ 引导，必须排在 import 前
#   E701 E702  一行多语句：导入任务状态流转惯用紧凑写法
#   F841  未使用局部变量：node_answer_output 的 char_budget 等是真问题，留到 S1/S3 修
#   B904 B905 B023  异常链 / zip 长度 / 闭包捕获循环变量：需逐个确认语义，不能机械改
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # 长行由注释与提示词模板主导，交给可读性判断
    "B008",   # FastAPI 依赖注入惯用 Depends() 作为默认值
    "I001",
    "E402",
    "E701",
    "E702",
    "F841",
    "B904",
    "B905",
    "B023",
]

[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
