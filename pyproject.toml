[project]
name = "knowledge-base"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    # 系统设置的敏感值使用 Fernet 加密落库，必须由本项目直接声明而不是依赖 minio 的传递依赖。
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "pymilvus[model]>=3.0.1",
    "modelscope>=1.39.1",
    "openai-agents>=0.20.0",
    "mcp<2.0.0",
    "dashscope>=1.26.7",
    "uvicorn[standard]>=0.52.3",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "asyncmy>=0.2.14",
    "pypdf>=6.16.2",
    "redis>=8.1.0",
]

[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
